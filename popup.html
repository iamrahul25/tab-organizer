<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Organizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon128.png" alt="" width="44" height="44" />
      <div class="header-text">
        <h1>Tab Organizer</h1>
        <p id="stats" class="stats">Loading…</p>
      </div>
      <button id="settings-toggle" class="theme-toggle" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">
        <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#settings" /></svg>
      </button>
      <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon icon-moon" viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
          <path d="M108.11,28.11A96.09,96.09,0,0,0,227.89,147.89,96,96,0,1,1,108.11,28.11Z" />
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
          <circle cx="128" cy="128" r="56" />
          <path d="M128 40V16M64 64 48 48M64 192 48 208M192 64l16-16M192 192l16 16M40 128H16M128 216v24M216 128h24" />
        </svg>
      </button>
    </header>

    <section id="settings" class="card settings" aria-labelledby="settings-title" hidden>
      <div class="settings-head">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-back" class="btn">Back</button>
      </div>
      <div class="zoom-row">
        <label for="zoom" class="zoom-label">Size <span class="zoom-hint">Text, icons and images</span></label>
        <output id="zoom-value" for="zoom">100%</output>
      </div>
      <div class="zoom-controls">
        <button id="zoom-out" class="btn btn-icon" aria-label="Smaller" title="Smaller">&minus;</button>
        <input id="zoom" type="range" min="80" max="130" step="5" value="100" />
        <button id="zoom-in" class="btn btn-icon" aria-label="Larger" title="Larger">+</button>
      </div>
      <button id="zoom-reset" class="btn">Reset to 100%</button>
    </section>

    <main id="main">
      <section class="card" aria-labelledby="sort-title">
        <svg class="icon card-icon" aria-hidden="true"><use href="icons/ui-icons.svg#sort" /></svg>
        <div class="card-text">
          <h2 id="sort-title">Sort tabs</h2>
          <p>Arrange tabs by URL, title, or domain.</p>
        </div>
        <div class="card-actions">
          <div class="select-wrap">
            <label class="sr-only" for="sort-key">Sort by</label>
            <select id="sort-key" class="control">
              <option value="url">By URL</option>
              <option value="domain">By domain</option>
              <option value="title">By title</option>
              <option value="recent">Recently used</option>
              <option value="random">Shuffle</option>
            </select>
            <svg class="icon caret" aria-hidden="true"><use href="icons/ui-icons.svg#caret-down" /></svg>
          </div>
          <button id="sort" class="btn btn-primary btn-icon" aria-label="Sort tabs" title="Sort tabs">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#play" /></svg>
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="dup-title">
        <svg class="icon card-icon" aria-hidden="true"><use href="icons/ui-icons.svg#duplicates" /></svg>
        <div class="card-text">
          <h2 id="dup-title">Remove duplicates</h2>
          <p>Close tabs with the same URL.</p>
        </div>
        <div class="card-actions">
          <button id="dedupe" class="btn btn-soft-danger">
            <span id="dedupe-label">Close tabs</span>
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="tidy-title">
        <svg class="icon card-icon" aria-hidden="true"><use href="icons/ui-icons.svg#group" /></svg>
        <div class="card-text">
          <h2 id="tidy-title">Tidy up</h2>
          <p class="nowrap">Group tabs and clean inactive ones.</p>
        </div>
        <div class="card-actions stack">
          <button id="group-toggle" class="btn" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#group" /></svg>
            <span id="group-toggle-label">Group by domain</span>
          </button>
          <button id="discard" class="btn" title="Unload background tabs from memory without closing them">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#suspend" /></svg>
            Suspend inactive
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="side-panel-title">
        <svg class="icon card-icon" aria-hidden="true"><use href="icons/ui-icons.svg#sidebar" /></svg>
        <div class="card-text">
          <h2 id="side-panel-title">Vertical tabs</h2>
          <p>Save space with a side tab bar.</p>
        </div>
        <div class="card-actions">
          <button id="side-panel-toggle" class="switch" role="switch" aria-checked="false" aria-labelledby="side-panel-title">
            <span class="switch-thumb"></span>
          </button>
        </div>
      </section>

      <section class="card card-sessions" aria-labelledby="saved-title">
        <svg class="icon card-icon" aria-hidden="true"><use href="icons/ui-icons.svg#bookmark" /></svg>
        <div class="card-text">
          <h2 id="saved-title">Saved sessions</h2>
          <p>Save and restore tab groups later.</p>
        </div>
        <div class="card-actions">
          <button id="save-session" class="btn">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#save" /></svg>
            Save session
          </button>
        </div>
        <ul id="session-list" class="session-list" aria-label="Saved sessions" hidden></ul>
      </section>
    </main>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
