<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Organizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Tab Organizer</h1>
      <p id="stats" class="muted">Loading…</p>
    </header>

    <section>
      <h2>Sort tabs</h2>
      <div class="row">
        <select id="sort-key">
          <option value="url">By URL</option>
          <option value="domain">By domain</option>
          <option value="title">By title</option>
          <option value="recent">Recently used first</option>
        </select>
        <label class="inline"><input type="checkbox" id="sort-reverse" /> Reverse</label>
      </div>
      <div class="row actions">
        <button id="sort" class="primary">Sort tabs</button>
        <button id="shuffle" class="shrink" title="Put tabs in random order">Shuffle</button>
        <button id="undo-sort" class="shrink" title="Restore the order from before the last sort or shuffle" disabled>
          Undo
        </button>
      </div>
    </section>

    <section>
      <h2>Duplicate tabs</h2>
      <select id="dup-mode" class="full">
        <option value="url">Same URL</option>
        <option value="domain">Same domain (keep one tab per site)</option>
      </select>
      <button id="dedupe" class="primary">Remove duplicates</button>
    </section>

    <section>
      <h2>Groups</h2>
      <button id="group-toggle" class="full">Group by domain</button>
    </section>

    <section>
      <h2>Saved tabs &amp; groups</h2>
      <div class="row">
        <input type="text" id="session-name" placeholder="Name (optional)" maxlength="60" />
        <button id="save-session" class="shrink">Save</button>
      </div>
      <p id="sessions-empty" class="muted">No saved sessions yet.</p>
      <ul id="session-list"></ul>
    </section>

    <section>
      <h2>More</h2>
      <div class="row">
        <button id="merge">Merge all windows</button>
        <button id="discard" title="Unload inactive tabs from memory without closing them">
          Suspend inactive
        </button>
      </div>
    </section>

    <p id="status" role="status"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
