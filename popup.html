<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Organizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon48.png" alt="" width="32" height="32" />
      <div class="header-text">
        <h1>Tab Organizer</h1>
        <p id="stats" class="stats">Loading…</p>
      </div>
      <button id="theme-toggle" class="btn btn-icon btn-ghost theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon icon-moon" viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
          <path d="M108.11,28.11A96.09,96.09,0,0,0,227.89,147.89,96,96,0,1,1,108.11,28.11Z" />
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 256 256" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
          <circle cx="128" cy="128" r="56" />
          <path d="M128 40V16M64 64 48 48M64 192 48 208M192 64l16-16M192 192l16 16M40 128H16M128 216v24M216 128h24" />
        </svg>
      </button>
    </header>

    <main id="main">
      <section class="card" aria-labelledby="sort-title">
        <h2 id="sort-title">
          <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#sort" /></svg>
          Sort tabs
        </h2>
        <div class="row">
          <label class="sr-only" for="sort-key">Sort by</label>
          <select id="sort-key" class="control grow">
            <option value="url">By URL</option>
            <option value="domain">By domain</option>
            <option value="title">By title</option>
            <option value="recent">Recently used first</option>
          </select>
          <button id="sort-reverse" class="btn" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#reverse" /></svg>
            Reverse
          </button>
        </div>
        <div class="row">
          <button id="sort" class="btn btn-primary grow">Sort tabs</button>
          <button id="shuffle" class="btn">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#shuffle" /></svg>
            Shuffle
          </button>
          <button id="undo-sort" class="btn btn-icon" aria-label="Undo last sort or shuffle" title="Undo last sort or shuffle" disabled>
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#undo" /></svg>
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="dup-title">
        <h2 id="dup-title">
          <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#duplicates" /></svg>
          Duplicate tabs
        </h2>
        <div class="row">
          <label class="sr-only" for="dup-mode">Match duplicates by</label>
          <select id="dup-mode" class="control grow" title="Same domain keeps one tab per site">
            <option value="url">Same URL</option>
            <option value="domain">Same domain</option>
          </select>
          <button id="dedupe" class="btn btn-primary">
            <span id="dedupe-label">Remove duplicates</span>
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="tidy-title">
        <h2 id="tidy-title">
          <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#group" /></svg>
          Tidy up
        </h2>
        <button id="group-toggle" class="btn" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#group" /></svg>
          <span id="group-toggle-label">Group by domain</span>
        </button>
        <div class="row">
          <button id="merge" class="btn grow">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#merge" /></svg>
            Merge windows
          </button>
          <button id="discard" class="btn grow" title="Unload background tabs from memory without closing them">
            <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#suspend" /></svg>
            Suspend inactive
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="saved-title">
        <h2 id="saved-title">
          <svg class="icon" aria-hidden="true"><use href="icons/ui-icons.svg#save" /></svg>
          Saved tabs &amp; groups
        </h2>
        <div class="row">
          <label class="sr-only" for="session-name">Session name</label>
          <input type="text" id="session-name" class="control grow" placeholder="Name this window (optional)" maxlength="60" />
          <button id="save-session" class="btn btn-primary">Save</button>
        </div>
        <p id="sessions-empty" class="empty">No saved sessions yet.</p>
        <ul id="session-list" class="session-list" aria-label="Saved sessions"></ul>
      </section>
    </main>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
